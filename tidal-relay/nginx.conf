worker_processes 1;
pid /tmp/nginx.pid;
events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;

  # 朗读接口的限速桶。边车另有每日字符预算兜底，这里只是把爆量挡在门外。
  limit_req_zone $binary_remote_addr zone=tts:1m rate=40r/m;
  access_log /dev/stdout;
  error_log /dev/stderr;

  server {
    listen 8080;

    # relay API（SSE 必须关缓冲、放长超时）
    location /relay/ {
      proxy_pass http://127.0.0.1:3011/;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      client_max_body_size 20m;
    }

    # 语音边车（ElevenLabs）。只有它看得见 API key；浏览器永远不直连 ElevenLabs。
    location /tts/ {
      limit_req zone=tts burst=8 nodelay;
      proxy_pass http://127.0.0.1:3012/tts/;
      proxy_read_timeout 120s;   # 合成一段长句可能要几十秒
      client_max_body_size 64k;
      proxy_set_header Host $host;
    }

    # PWA 前端
    location /chat/ {
      alias /opt/tidal-echo/web/;
      try_files $uri $uri/ /chat/index.html;
    }

    location = / { return 302 /chat/; }
  }
}
